name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'

    - name: Setup Flutter Project Architecture
      run: |
        # ১. অস্থায়ী একটি সম্পূর্ণ ফ্ল্যাটার প্রজেক্ট তৈরি
        flutter create --org com.example temp_project
        # ২. অ্যান্ডয়েড ও অন্যান্য প্রয়োজনীয় কনফিগারেশন কপি করা
        cp -rn temp_project/android .
        # ৩. যদি lib ফোল্ডার না থাকে তবে কপি করবে
        [ -d "lib" ] || cp -r temp_project/lib .
        rm -rf temp_project

    - name: Get dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-bg-player
        path: build/app/outputs/flutter-apk/app-release.apk
